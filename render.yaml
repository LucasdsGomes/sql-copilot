# Render Blueprint: deploys the Docker image as a free web service.
# Secrets are never stored here: `sync: false` makes Render ask for the value in its dashboard.
services:
  - type: web
    name: sql-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    # CD without extra tooling: deploy only after the GitHub Actions checks (ruff, pytest, docker
    # smoke test) have passed for the commit.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # paste it in the Render dashboard; never commit it
      - key: API_KEYS
        generateValue: true # random 256-bit key; read it from the service's Environment tab
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: RATE_LIMIT
        value: 10/minute
      - key: MAX_ROWS
        value: "100"
      # FORWARDED_ALLOW_IPS is deliberately NOT set. The rate limiter does not use client IPs: every
      # request without a valid API key shares one global bucket (see api/main.py), so proxy
      # topology cannot change the quota and X-Forwarded-For cannot be forged to dodge it.
      # PORT is injected by Render and read by the Dockerfile.
